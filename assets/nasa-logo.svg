<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" width="120" height="100">
  <defs>
    <radialGradient id="nasaBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1b4fd8"/>
      <stop offset="100%" stop-color="#0b1e59"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- NASA Sphere -->
  <circle cx="60" cy="50" r="46" fill="url(#nasaBg)" stroke="#38bdf8" stroke-width="1.5" filter="url(#glow)" />
  <!-- Stars in sphere -->
  <circle cx="35" cy="30" r="1" fill="#ffffff" opacity="0.9" />
  <circle cx="48" cy="22" r="1.5" fill="#ffffff" opacity="0.8" />
  <circle cx="85" cy="35" r="1.2" fill="#ffffff" opacity="0.9" />
  <circle cx="32" cy="68" r="1.2" fill="#ffffff" opacity="0.7" />
  <circle cx="80" cy="65" r="1" fill="#ffffff" opacity="0.9" />
  <circle cx="60" cy="78" r="1.4" fill="#ffffff" opacity="0.8" />
  <circle cx="25" cy="45" r="0.8" fill="#ffffff" opacity="0.6" />
  <circle cx="95" cy="52" r="1" fill="#ffffff" opacity="0.8" />
  <!-- Red Orbit Vector -->
  <path d="M 20 62 Q 55 15 105 32 Q 65 60 38 78 Z" fill="#e11d48" opacity="0.95" />
  <!-- Orbit Ring -->
  <ellipse cx="60" cy="50" rx="43" ry="17" fill="none" stroke="#f8fafc" stroke-width="2.5" stroke-dasharray="160 50" transform="rotate(-25 60 50)" />
  <!-- NASA Bold Text -->
  <text x="60" y="58" font-family="'Arial Black', 'Impact', sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">NASA</text>
</svg>

